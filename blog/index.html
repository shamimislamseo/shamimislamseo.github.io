<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SEO Blog | ShamimIslamSEO</title><meta name="description" content="SEO, AI SEO, Keyword Research and Technical SEO articles by ShamimIslamSEO."><meta name="robots" content="index,follow"><link rel="canonical" href="https://shamimislamseo.github.io/blog/"><meta property="og:title" content="SEO Blog | ShamimIslamSEO"><meta property="og:description" content="Practical SEO, AI SEO, Keyword Research and Technical SEO articles."><meta property="og:type" content="website"><meta property="og:url" content="https://shamimislamseo.github.io/blog/"><link rel="stylesheet" href="../style.css"></head><body><header class="nav"><a class="brand" href="../">SHAMIM ISLAM <span>SEO</span></a><nav><a href="../">Home</a><a href="#articles">Articles</a></nav></header><main><section class="hero" style="min-height:55vh"><p class="eyebrow">SHAMIMISLAMSEO • BLOG</p><h1>SEO <span>Knowledge Hub</span></h1><p class="lead">Practical guides covering SEO, AI SEO, keyword research and technical SEO.</p></section><section id="articles" class="section"><div class="blog-tools"><input id="search" type="search" placeholder="Search articles..." aria-label="Search articles"><div class="filters"><button class="btn filter active" data-category="all">All</button><button class="btn filter" data-category="SEO">SEO</button><button class="btn filter" data-category="AI SEO">AI SEO</button><button class="btn filter" data-category="Keyword Research">Keyword Research</button><button class="btn filter" data-category="Technical SEO">Technical SEO</button></div></div><div id="posts" class="grid"></div><p id="empty" hidden>No matching articles found.</p></section></main><footer>© <span id="year"></span> ShamimIslamSEO · SEO & Digital Marketing</footer><script>const posts=[{title:'What Is SEO? A Practical Beginner Guide',cat:'SEO',desc:'Understand the core SEO process, search intent and the fundamentals of organic visibility.',url:'seo-basics.html'},{title:'AI SEO: Preparing Content for AI Search',cat:'AI SEO',desc:'A practical framework for creating useful, structured and search-friendly content for modern AI search.',url:'ai-seo.html'},{title:'Keyword Research: From Seed to Search Intent',cat:'Keyword Research',desc:'Learn how to organize keywords by intent, topic, priority and content opportunity.',url:'keyword-research.html'},{title:'Technical SEO Checklist for Modern Websites',cat:'Technical SEO',desc:'A focused checklist for crawlability, indexing, performance, structured data and site architecture.',url:'technical-seo.html'}];let category='all';const postsEl=document.getElementById('posts'),search=document.getElementById('search'),empty=document.getElementById('empty');function render(){const q=search.value.toLowerCase().trim();const list=posts.filter(p=>(category==='all'||p.cat===category)&&(!q||(p.title+' '+p.desc+' '+p.cat).toLowerCase().includes(q)));postsEl.innerHTML=list.map(p=>`<article class="reveal visible"><div class="tag">${p.cat}</div><h3>${p.title}</h3><p>${p.desc}</p><a href="${p.url}">Read article →</a></article>`).join('');empty.hidden=list.length!==0}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');category=b.dataset.category;render()});search.oninput=render;document.getElementById('year').textContent=new Date().getFullYear();render();</script></body></html>
